<noscript><p style="color:#EDEAE2;padding:24px">Для работы сайта включите JavaScript в браузере.</p></noscript>
<script>
// Проверка свежести: если на сервере версия новее той, что показал телефон, страница перезагружается сама.
window.APP_VERSION = 30;
fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
  if (!j || !(j.v > window.APP_VERSION)) return;
  var tried = null;
  try { tried = sessionStorage.getItem('reloadedFor'); sessionStorage.setItem('reloadedFor', String(j.v)); } catch (e) {}
  if (tried === String(j.v)) return; // уже пробовали — не зацикливаемся
  location.replace(location.pathname + '?r=' + j.v);
}).catch(function () {});
</script>
